name: PR conventions

# Enforces the PR-level conventions (Conventional Commit title + required
# labels). These live in their own workflow — separate from ci.yml — because
# they must react to events ci.yml does not care about: `edited` (the author
# fixed the PR title) and `labeled`/`unlabeled` (the author added the required
# labels after opening). With the default pull_request trigger these checks
# would run once at open, before labels exist, and never re-evaluate.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

# Least privilege: only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs for the same PR (e.g. rapid label/title edits).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Conventional PR title
    # Squash-merge promotes the PR title to the commit message, so the title
    # itself must be a valid Conventional Commit. commitlint enforces the same
    # rules as the local commit-msg hook (commitlint.config.mjs).
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version comes from `packageManager` in package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pass the title via env (not inline ${{ }}) to avoid shell injection via
      # an attacker-controlled PR title.
      - name: Lint PR title with commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | pnpm exec commitlint

  pr-labels:
    name: Required PR labels
    # Every PR must carry one each of type:*, size:*, and safe:*.
    #
    # Dependabot is exempt: labeling a PR with the full trio is part of the
    # agent-orchestration workflow (an author picks type:*/size:* by hand or
    # via the orchestrator), and a bot can't run that workflow. .github/dependabot.yml
    # already applies the labels it *can* know up front (dependencies,
    # skip-changelog, safe:human); requiring type:*/size:* on top of that would
    # leave every Dependabot PR red until a human hand-labels each one.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Require type / size / safe labels
        # Wrap the joined label list in delimiting commas and match a ',<prefix>:'
        # boundary so an unrelated label that merely contains the prefix as a
        # substring (e.g. a hypothetical `subtype:x`) can't satisfy the gate.
        env:
          HAS_TYPE: ${{ contains(format(',{0},', join(github.event.pull_request.labels.*.name, ',')), ',type:') }}
          HAS_SIZE: ${{ contains(format(',{0},', join(github.event.pull_request.labels.*.name, ',')), ',size:') }}
          HAS_SAFE: ${{ contains(format(',{0},', join(github.event.pull_request.labels.*.name, ',')), ',safe:') }}
        run: |
          MISSING=""
          [ "$HAS_TYPE" = "true" ] || MISSING="$MISSING type:*"
          [ "$HAS_SIZE" = "true" ] || MISSING="$MISSING size:*"
          [ "$HAS_SAFE" = "true" ] || MISSING="$MISSING safe:*"
          if [ -n "$MISSING" ]; then
            echo "::error::This PR is missing required label(s):$MISSING. Every PR needs at least one each of type:*, size:*, and safe:* (see docs/agents/tasks.md → Label Reference)."
            exit 1
          fi
          echo "✓ PR carries type:*, size:*, and safe:* labels"

  pr-tldr:
    name: Plain-language TL;DR
    # Every PR must lead with a filled-in `## TL;DR` section — the 1–3 plain
    # sentences a non-engineer can understand. slack-merge-updates.yml posts it
    # to Slack when the PR merges, so this gate is what guarantees the feed has
    # real material to work with (see docs/agents/merge-updates.md).
    #
    # Dependabot is exempt here too (like pr-labels and adversarial-review
    # below): its PR bodies are bot-generated release notes and it cannot
    # author our template sections — the same reason its PRs carry
    # `skip-changelog` for the changelog gate (see .github/dependabot.yml).
    # Unlike the changelog gate, release/* branches stay in scope on purpose: a
    # release PR can trivially say what's shipping, and that's exactly what the
    # Slack feed is for. No skip label exists for this gate.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      # The validator is a zero-dep ESM script; node is already on ubuntu-latest,
      # so we only need a checkout to read the script file — no pnpm/setup-node.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pass the body via env (not inline ${{ }}) to avoid shell injection via an
      # attacker-controlled PR body — exactly like the adversarial-review job.
      - name: Validate the TL;DR block in the PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/scripts/check-tldr-block.mjs

  adversarial-review:
    name: Adversarial review gate
    # Enforces the 2-round adversarial review loop in docs/agents/orchestration.md.
    # This re-evaluates on `labeled`/`unlabeled` (author added the gate label) and
    # `edited` (author pasted the verdict into the body) thanks to the triggers above.
    #
    # `skip-review` bypasses the gate (trivial / human-only change). Otherwise BOTH
    # must hold: the `review:adversarial-passed` label is present AND the PR body
    # contains a well-formed review record (validated by check-review-block.mjs).
    #
    # Dependabot is exempt: the 2-round adversarial review loop is a worker/
    # reviewer-subagent workflow step in docs/agents/orchestration.md that a bot
    # has no way to run, and it has no author who could apply `skip-review`
    # either — the gate would stay red on every Dependabot PR until a human
    # hand-applied `skip-review` to each one.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      # Same delimiting-comma boundary technique as pr-labels: wrap the joined
      # label list in commas so a label that merely contains the name as a
      # substring can't satisfy the gate.
      - name: Short-circuit when skip-review is present
        env:
          HAS_SKIP: ${{ contains(format(',{0},', join(github.event.pull_request.labels.*.name, ',')), ',skip-review,') }}
        run: |
          if [ "$HAS_SKIP" = "true" ]; then
            echo "✓ skip-review label present — adversarial-review gate bypassed (trivial/human-only change)."
            echo "SKIP=true" >> "$GITHUB_ENV"
          else
            echo "SKIP=false" >> "$GITHUB_ENV"
          fi

      - name: Require the review:adversarial-passed label
        if: env.SKIP != 'true'
        env:
          HAS_REVIEWED: ${{ contains(format(',{0},', join(github.event.pull_request.labels.*.name, ',')), ',review:adversarial-passed,') }}
        run: |
          if [ "$HAS_REVIEWED" != "true" ]; then
            echo "::error::Missing the \`review:adversarial-passed\` label. Run the 2-round adversarial review loop, then apply the label — or apply \`skip-review\` for a trivial/human-only change (see docs/agents/orchestration.md)."
            exit 1
          fi
          echo "✓ review:adversarial-passed label present"

      # The parser is a zero-dep ESM script; node is already on ubuntu-latest, so
      # we only need a checkout to read the script file — no pnpm/setup-node/install.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SKIP != 'true'

      # Pass the body via env (not inline ${{ }}) to avoid shell injection via an
      # attacker-controlled PR body — exactly like pr-title passes the title.
      - name: Validate the adversarial-review block in the PR body
        if: env.SKIP != 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/scripts/check-review-block.mjs

  owner-review:
    name: Owner-review gate
    # Layer 2 of the owner-review guardrail (ADR-015, docs/agents/governance.md).
    # FAILS the PR when it touches an owner-gated surface (cost / legal / security
    # / trust & safety / data-loss migration / privacy / safety-disclaimer copy)
    # but is NOT labeled `safe:human` — i.e. an agent tried to self-classify it
    # `safe:agent` (auto-mergeable). Re-evaluates on `labeled`/`unlabeled` (the
    # triggers above), so relabeling `safe:human` re-runs it.
    #
    # This is a forcing function; the ENFORCEMENT is Layer 1 (.github/CODEOWNERS
    # + branch protection), which makes an owned-path PR unmergeable until the
    # owner approves. There is deliberately NO bypass label (unlike skip-review):
    # the only way past a gated change is the owner's own review + merge.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # fetch-depth: 0 so the merge-base against the PR base resolves (the gate
      # diffs base…HEAD to find this PR's changed files + added lines).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Zero-dep ESM script; node is already on ubuntu-latest, so (like pr-tldr /
      # adversarial-review) we only need a checkout — no pnpm/setup-node/install.
      # Labels are passed via env (newline-joined), NOT inline ${{ }}, so a
      # hostile label can't inject into the shell. BASE_SHA drives the merge-base
      # diff, mirroring the diff-coverage job.
      - name: Enforce owner review on gated surfaces
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Comma-joined (label names never contain commas); the script splits on
          # commas/newlines. Passed via env, never inline, to avoid injection.
          OWNER_REVIEW_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node .github/scripts/check-owner-review.mjs
