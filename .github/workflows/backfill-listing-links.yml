name: Backfill production listing links

# One-time (but re-runnable) data migration for typed listing links (AUB-202):
# inserts a `menu`-kind `listing_links` row for every listing that still
# carries its menu link only in the legacy `listings.menu_url` column, so old
# rows join the typed-links model. Non-http(s) legacy values are reported and
# left untouched, never guessed.
#
# Manual + idempotent: run it from the Actions tab ("Run workflow"). The
# insert is `onConflictDoNothing` on the (listing, kind) unique constraint, so
# already-linked listings are no-ops and re-running never overwrites a link a
# user has since edited.
#
# API-FREE: `pnpm db:backfill:listing-links` makes no network call besides the
# database — only PROD_DATABASE_URL is needed.
#
# Skips gracefully (with a warning, not a failure) if PROD_DATABASE_URL is not
# configured, so the workflow is safe to merge before the secret exists.
on:
  workflow_dispatch: {}

# Least privilege: this workflow only reads the repo (the DB URL is a secret).
permissions:
  contents: read

# Never let two backfills — or a backfill + seed — race: this shares the
# `seed-production` concurrency group with the seed and maps-URL backfill
# workflows (the seed also runs migrations inside it). Note the standalone
# migrate workflow uses its own group, so it is NOT serialized against this one.
concurrency:
  group: seed-production
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill listing links
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # pnpm version comes from `packageManager` in package.json
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The `secrets` context isn't allowed in step-level `if`, so detect the
      # required secret here and gate the backfill step on this output.
      - name: Check for required secrets
        id: cfg
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$PROD_DATABASE_URL" ]; then
            echo "::warning::PROD_DATABASE_URL is not set — skipping listing-links backfill."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Backfill listing links
        if: steps.cfg.outputs.enabled == 'true'
        run: pnpm db:backfill:listing-links
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
