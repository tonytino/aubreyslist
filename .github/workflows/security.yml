name: Security

# Secret scanning, dependency-vulnerability scanning, and a license allowlist.
# SAST (CodeQL) lives in its own workflow (.github/workflows/codeql.yml) because
# it needs `security-events: write` and a weekly schedule — keeping it separate
# lets this workflow stay locked to the least privilege each job actually needs.
#
# Every third-party action below is pinned to a commit SHA with a trailing
# `# vX.Y.Z` comment (repo convention — see ci.yml). The checkout / pnpm / node
# SHAs are copied verbatim from ci.yml.
on:
  push:
    branches: ["main"]
  pull_request:

# Default to no permissions; each job opts into exactly what it needs.
permissions: {}

# Cancel superseded runs on the same ref (matches ci.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Secret scanning — gitleaks. Fails the job on ANY finding (the action exits
  # non-zero when leaks are detected). gitleaks-action v2 is free for user
  # accounts (only GitHub *Organizations* need a GITLEAKS_LICENSE); this repo is
  # under a user account, so no license is set. `fetch-depth: 0` is required so
  # gitleaks can scan the full commit history of the push/PR range, not just the
  # tip commit.
  # ---------------------------------------------------------------------------
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Dependency vulnerabilities — osv-scanner, gated through a COOLDOWN-AWARE
  # wrapper (.github/scripts/check-osv.mjs).
  #
  # A bare osv-scanner run fails the moment an advisory is published. That
  # contradicts `minimumReleaseAge: 10080` in pnpm-workspace.yaml, which forbids
  # pnpm from installing any version younger than 7 days — so for up to a week
  # CI would demand a fix the package manager is configured to refuse, on every
  # PR, with no escape but a hand bypass. The wrapper reconciles the two: a
  # finding whose fix is still quarantined is a deferred `::warning::` carrying
  # its unblock date; once the quarantine lapses it becomes a hard failure on
  # its own. Advisories with NO available fix, and anything CVSS Critical, fail
  # immediately. Full rationale in the script's header.
  #
  # `continue-on-error` on the scan step is load-bearing: osv-scanner exits
  # non-zero when it finds anything, which would kill the job before the wrapper
  # could classify the findings. GitHub does not expose a step's numeric exit
  # code, so the wrapper cannot tell "vulns found" (exit 1) from "scanner broke"
  # (exit 128) that way — it infers a broken scan from a missing or unparseable
  # results file and fails closed.
  #
  # We pin the *sub-action* (…/osv-scanner-action) rather than the reusable
  # workflow so this stays a normal job in this workflow with least-privilege
  # `contents: read` — the reusable workflow additionally wants
  # `security-events: write` to upload SARIF, which we don't need for a plain
  # pass/fail gate. `--lockfile=pnpm-lock.yaml` targets the lockfile explicitly;
  # `--config` points at the repo-root waiver file (auto-discovery resolves
  # relative to the SCANNED file's directory and does not propagate, so being
  # explicit is the safe form).
  #
  # The wrapper reads npm publish timestamps from registry.npmjs.org, so this
  # job needs egress to the registry in addition to `contents: read`.
  # ---------------------------------------------------------------------------
  osv-scanner:
    name: Dependency vulns (osv-scanner)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node only — check-osv.mjs is zero-dependency, so there is deliberately
      # no pnpm setup or `pnpm install` here (the gate must be able to run even
      # when dependency installation is what's broken).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - id: scan
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --config=osv-scanner.toml
            --format=json
            --output-file=osv-results.json

      - name: Gate findings against the release-age quarantine
        run: node .github/scripts/check-osv.mjs osv-results.json

  # ---------------------------------------------------------------------------
  # License allowlist — zero-dep. Runs `pnpm licenses list --json`, parses it,
  # and fails if any installed dependency carries a license OUTSIDE an explicit
  # permissive allowlist (see .github/scripts/check-licenses.mjs). Copyleft or
  # unknown licenses are surfaced as `::error::` annotations naming the offending
  # package + license for human review.
  # ---------------------------------------------------------------------------
  license-allowlist:
    name: License allowlist
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version comes from `packageManager` in package.json
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dependency licenses against the allowlist
        run: node .github/scripts/check-licenses.mjs
