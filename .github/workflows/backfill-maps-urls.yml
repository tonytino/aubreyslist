name: Backfill production maps URLs

# One-time (but re-runnable) data fix: rewrites every listing whose `maps_url`
# still uses the legacy `https://www.google.com/maps/place/?q=place_id:…` format
# — which Google Maps no longer resolves, dead-ending the "Open in Google Maps"
# link — to the documented Maps URLs API format
# (`/maps/search/?api=1&query=…&query_place_id=…`), built from columns already
# on each row.
#
# Manual + idempotent: run it from the Actions tab ("Run workflow"). Rewritten
# rows never match the legacy prefix again, so re-running is a no-op.
#
# API-FREE: `pnpm db:backfill:maps-urls` makes no network call besides the
# database — only PROD_DATABASE_URL is needed, no Google Places API key.
#
# Skips gracefully (with a warning, not a failure) if PROD_DATABASE_URL is not
# configured, so the workflow is safe to merge before the secret exists.
on:
  workflow_dispatch: {}

# Least privilege: this workflow only reads the repo (the DB URL is a secret).
permissions:
  contents: read

# Never let two backfills — or a backfill + seed — race: this shares the
# `seed-production` concurrency group with the seed workflow (which also runs
# migrations inside it). Note the standalone migrate workflow uses its own
# group, so it is NOT serialized against this one.
concurrency:
  group: seed-production
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill maps URLs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # pnpm version comes from `packageManager` in package.json
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The `secrets` context isn't allowed in step-level `if`, so detect the
      # required secret here and gate the backfill step on this output.
      - name: Check for required secrets
        id: cfg
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$PROD_DATABASE_URL" ]; then
            echo "::warning::PROD_DATABASE_URL is not set — skipping maps-URL backfill."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Backfill maps URLs
        if: steps.cfg.outputs.enabled == 'true'
        run: pnpm db:backfill:maps-urls
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
