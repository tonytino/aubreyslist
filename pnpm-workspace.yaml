# pnpm settings (pnpm-workspace.yaml is the config home in pnpm 10+).
#
# Supply-chain hardening — see https://pnpm.io/supply-chain-security
#
# minimumReleaseAge: quarantine newly published versions for 7 days
#   (10080 minutes) before pnpm will install them, INCLUDING transitive deps.
#   A version that is yanked or found compromised shortly after publish is not
#   pulled in during the window. This mirrors the `cooldown: default-days: 7`
#   in .github/dependabot.yml so both paths — deliberate Dependabot PRs and
#   plain `pnpm install` resolution — honor the same publish-then-attack window.
#   (pnpm 11 defaults this to 1 day; pinned to 7 days here to match Dependabot.)
#
# blockExoticSubdeps: only DIRECT dependencies may use exotic sources (git
#   repositories, tarball URLs). Transitive deps must resolve from the registry,
#   closing the vector where a registry package points a subdep at an
#   unscanned github/tarball reference. (pnpm 11 defaults this to true; pinned
#   explicitly so the posture survives a future default change.)
minimumReleaseAge: 10080
#
# minimumReleaseAgeExclude: currently EMPTY, and that is the healthy state.
#   Entries here are per-version fast-tracks past the quarantine above, so each
#   one is a hole in the supply-chain posture. Add one only for an urgent CVE
#   whose fix cannot wait out the window, name the exact `package@version`, and
#   track its removal — see docs/agents/dependencies.md.
#   (The hono@4.12.34 / CVE-2026-69207 fast-track lived here from 2026-08-04
#   until its window cleared on 2026-08-10; removed under AUB-255.)
blockExoticSubdeps: true

# Dependency version pins. Moved here from the package.json `pnpm.overrides`
# field, which pnpm 11 no longer reads (see https://pnpm.io/settings). Several
# of these are security floors (browserslist, shell-quote, h3, tar, ws, qs,
# fast-uri, minimatch, brace-expansion, glob, node-forge, seroval,
# serialize-javascript, source-map-js, @babel/core), so keeping them effective is
# part of the same supply-chain posture.
#
# brace-expansion + minimatch are floored TOGETHER, and the pairing is
# load-bearing: the brace-expansion major pinned here must be the one the pinned
# minimatch line declares. brace-expansion v2 is CommonJS
# (`module.exports = expandTop`) while v5 is `type: module` whose CJS emit
# exports a NAMED `expand` with no default. minimatch@5 calls the module object
# itself and minimatch@9 calls `.default`, so neither works with v5; minimatch@10
# and @11 use the named `.expand` (minimatch 11 declares brace-expansion
# ^5.0.12).
#
# A mismatch fails LAZILY and CONDITIONALLY. require() succeeds, and
# braceExpand() short-circuits on any pattern with no {...} group, so only
# compiling a BRACE-CONTAINING pattern throws. A green build proves nothing
# here; re-verify the pairing by resolving the tree, not by trusting CI.
#
# brace-expansion is exact-pinned: GHSA-mh99-v99m-4gvg is fixed only on the 5.x
# line (no 2.x/3.x backports), so every copy must be 5.x, which in turn holds
# minimatch at a line that uses the named `.expand`.
#
# The minimatch and glob keys are global, so they are CEILINGS as well as
# floors. minimatch ^11 overrides @stryker-mutator/core's declared `~10.2.4`,
# and glob ^14 overrides archiver-utils' ^10 and @vercel/nft's / Sentry's ^13 —
# all three call APIs glob 14 still exports (`glob`, `sync`). They clear
# GHSA-g3hv-75wg-m249 (minimatch 11.0.1) and GHSA-3g3m-2fjr-6pw4 (glob 14.0.2),
# which have no backports to the older lines.
# Remove the minimatch key once @stryker-mutator/core declares minimatch >=11.
# Remove the glob key once archiver-utils, @vercel/nft and
# @sentry/bundler-plugins declare glob >=14.0.2.
#
# seroval and seroval-plugins move in lock-step. `~1.6.11` is a deliberate
# ceiling below 1.7.x: it clears GHSA-f86p-h4j2-7qgj (fixed 1.6.11) without
# taking an unvetted minor into the SSR serializer.
# Remove both keys once the resolved @tanstack/router-core declares
# seroval >=1.6.11.
#
# @babel/core is floored on the 7.x line only (`@babel/core@<8`), which clears
# GHSA-4x5r-pxfx-6jf8. The 8.x line is left unfloored on purpose: 8.0.9 is past
# the fix. A bare key would also force @stryker-mutator/instrumenter 10 (which
# declares ~8.0.0) back onto core 7, where Babel 7 parses the AST and Babel 8's
# generator crashes printing it (TSFunctionType `parameters` became `params`).
# Remove once no Babel 7 consumer resolves below 7.29.6.
overrides:
  browserslist: "^4.28.7"
  shell-quote: "^1.8.4"
  h3: "^1.15.9"
  nitropack: "^2.13.4"
  tar: "^7.5.21"
  ws: "^8.21.0"
  fast-uri: "^3.1.9"
  minimatch: "^11.0.1"
  brace-expansion: "5.0.12"
  "@babel/core@<8": "^7.29.6"
  qs: "^6.16.1"
  diff: "^8.0.3"
  glob: "^14.0.2"
  node-forge: "^1.4.1"
  seroval: "~1.6.11"
  seroval-plugins: "~1.6.11"
  serialize-javascript: "^7.1.3"
  source-map-js: "^1.2.2"
  "@esbuild-kit/core-utils>esbuild": "^0.25.0"
  tsx>esbuild: "^0.28.1"

# Dependency install/build scripts are NOT run by default in pnpm 10+ (a change
# from pnpm 9, which ran every dependency's scripts unconditionally). Only the
# packages set to `true` here may run postinstall/build scripts — an explicit
# allowlist that shrinks install-time attack surface. Each needs its script for
# a real reason: esbuild / @parcel/watcher / @sentry/cli fetch or compile a
# native binary, @biomejs/biome downloads its platform binary, lefthook installs
# git hooks. Refresh candidates with `pnpm approve-builds`.
allowBuilds:
  "@biomejs/biome": true
  "@parcel/watcher": true
  "@sentry/cli": true
  esbuild: true
  lefthook: true
