# osv-scanner waivers — reviewed, deliberately-accepted advisories.
#
# Read this together with .github/scripts/check-osv.mjs. The two mechanisms
# handle DIFFERENT things and must not be confused:
#
#   check-osv.mjs  — "the fix exists but pnpm can't install it yet."
#                    Automatic, self-expiring, needs no entry here. A finding
#                    whose fixed version is still inside the `minimumReleaseAge`
#                    quarantine in pnpm-workspace.yaml is deferred with a
#                    warning and turns into a hard failure by itself the day the
#                    quarantine lapses. You do NOT need a waiver for these.
#
#   this file      — "we looked at it and accepted it." The wrapper cannot
#                    express that judgement, and deliberately so. Use an entry
#                    here only when there is nothing to wait for:
#                      * no fixed version is published at all, or
#                      * the advisory genuinely does not apply to how we use the
#                        package (e.g. a server-side sink we never reach).
#
# osv-scanner applies these BEFORE emitting JSON, so a waived advisory never
# reaches the wrapper at all.
#
# ── How to add a waiver ──────────────────────────────────────────────────────
# Every entry needs all three fields. `ignoreUntil` is not optional here as a
# matter of repo policy: an unbounded waiver is how a known vulnerability
# quietly becomes permanent. Pick a date you are willing to be reminded on —
# when it passes the advisory reappears and fails the build.
#
#   [[IgnoredVulns]]
#   id = "GHSA-xxxx-xxxx-xxxx"
#   ignoreUntil = 2026-09-01
#   reason = "Why this does not apply to us, who decided, and what changes on
#             the expiry date."
#
# Note `ignoreUntil` is a bare TOML date (no quotes). Also note that ignoring an
# id ignores its aliases too, so one entry covers the GHSA and its CVE.
#
# This surface is owner-gated (/.github/ and the supply-chain paths in
# .github/CODEOWNERS): accepting a vulnerability is the owner's call, so any PR
# adding an entry here is `safe:human`.
#
# ── Current waivers ──────────────────────────────────────────────────────────

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2026-11-11
reason = "deepmerge@4.3.1 (low, prototype poisoning in mergeObject); no fixed version is published. Path: @tanstack/nitro-v2-vite-plugin -> nitropack -> @rollup/plugin-node-resolve -> deepmerge, which merges plugin options at build time only; deepmerge is absent from .output/server. Approved by repo owner 2026-11-04, 7-day window: on expiry take the fix if published, else re-review."
